name:
  Microservices Tuto
version: '4'
services:
 mysql-ord:
  image: mysql:8.3.0
  container_name: mysql-order
  environment:
    MYSQL_ROOT_PASSWORD: mysql
  ports:
    - "3306:3306"
  volumes:
    - ./data/mysql-order:/var/lib/mysql
    - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql