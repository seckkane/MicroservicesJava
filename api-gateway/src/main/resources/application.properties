spring.application.name=api-gateway
server.port=8090

# === Security ===
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8083/realms/spring-microservices-security-realm

# === Swagger Documentation ===
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs

# === Service URLs ===
product.service.url=http://localhost:8080
order.service.url=http://localhost:8082
inventory.service.url=http://localhost:8086

# === Swagger Aggregation ===
springdoc.swagger-ui.urls[0].name=Product Service
springdoc.swagger-ui.urls[0].url=/aggregate/product-service/v3/api-docs
springdoc.swagger-ui.urls[1].name=Order Service
springdoc.swagger-ui.urls[1].url=/aggregate/order-service/v3/api-docs
springdoc.swagger-ui.urls[2].name=Inventory Service
springdoc.swagger-ui.urls[2].url=/aggregate/inventory-service/v3/api-docs

# === Actuator Endpoints ===
management.health.circuitbreakers.enabled=true
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

# === Resilience4j Circuit Breaker - Configuration par défaut ===
resilience4j.circuitbreaker.configs.default.registerHealthIndicator=true
resilience4j.circuitbreaker.configs.default.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.configs.default.slidingWindowSize=10
resilience4j.circuitbreaker.configs.default.failureRateThreshold=50
# === 5 secondes : Durée en état OPEN ===
resilience4j.circuitbreaker.configs.default.waitDurationInOpenState=5s
# === HALF_OPEN : Nombre d'appels de test ===
resilience4j.circuitbreaker.configs.default.permittedNumberOfCallsInHalfOpenState=3
# === Transition automatique ===
resilience4j.circuitbreaker.configs.default.automaticTransitionFromOpenToHalfOpenEnabled=true
resilience4j.circuitbreaker.configs.default.minimumNumberOfCalls=5

# === Instances de Circuit Breaker pour chaque service ===
#resilience4j.circuitbreaker.instances.productService.baseConfig=default
#resilience4j.circuitbreaker.instances.orderService.baseConfig=default
#resilience4j.circuitbreaker.instances.inventoryService.baseConfig=default

# === Resilience4j Timeout ===
resilience4j.timelimiter.configs.default.timeout-duration=3s
#resilience4j.timelimiter.instances.productService.baseConfig=default
#resilience4j.timelimiter.instances.orderService.baseConfig=default
#resilience4j.timelimiter.instances.inventoryService.baseConfig=default

# === Resilience4j Retry ===
resilience4j.retry.configs.default.max-attempts=3
resilience4j.retry.configs.default.wait-duration=2s
#resilience4j.retry.instances.productService.baseConfig=default
#resilience4j.retry.instances.orderService.baseConfig=default
#resilience4j.retry.instances.inventoryService.baseConfig=default

# === Observability (Metrics & Tracing) ===
#management.metrics.distribution.percentiles-histogram.http.server.requests=true
#management.observations.key-values.application=api-gateway
#management.tracing.sampling.probability=1.0

# === Logging pour debug ===
logging.level.io.github.resilience4j=DEBUG
logging.level.org.springframework.cloud.gateway=DEBUG